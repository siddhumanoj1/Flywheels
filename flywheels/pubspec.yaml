name: flywheels
description: "FLYWHEELS AUTO mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  file_picker: ^10.1.9
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdf: ^3.12.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  sms_autofill: ^2.5.0
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/flywheels-logo.png
    - assets/car_anatomy/
    - assets/car_status/car.svg
    - assets/car_status/repair.svg
    - assets/car_status/tire.svg
